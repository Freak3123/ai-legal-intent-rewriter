[project]
name = "legal-rewriter-ml"
version = "0.1.0"
description = "ML inference service for the AI Legal Intent Rewriter"
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "spacy>=3.7.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "datasets>=3.0.0",
    "transformers>=4.46.0",
    "torch>=2.5.0",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.13",
    "Pillow>=10.0.0",
    "sentencepiece>=0.2.0",
    "huggingface-hub>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "A", "C4", "RET", "SIM"]
ignore = ["S101"] # allow `assert` in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
