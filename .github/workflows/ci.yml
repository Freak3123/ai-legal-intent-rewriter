name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ml:
    name: ML (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --frozen || uv sync
      - name: Install spaCy model (lazy fallback path is also covered, but we want full coverage in CI)
        run: uv run python -m spacy download en_core_web_sm
      - name: Run tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .

  web:
    name: Web (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
        working-directory: .
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
